services:
  - type: web
    name: tequami-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: EMBEDDING_DIM
        value: "384"
      - key: CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: FALLBACK_CONFIDENCE_THRESHOLD
        value: "0.60"
      - key: RETRIEVAL_TOP_K
        value: "5"
      - key: NEXTAUTH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: govrouter-db
    plan: free
    databaseName: govrouter
    user: govrouter
